name: Deploy Todo Backend with sonarqube

on:
  push:
    branches:
      - main

  workflow_dispatch:

# ==============================================================
# GLOBAL ENVIRONMENT
# ==============================================================
env:
  APP_NAME: todo-backend
  IMAGE_TAG: ${{ github.sha }}
  CONTAINER_NAME: todo-backend-app
  APP_VERSION: ${{ github.run_number }}

jobs:

  # ==============================================================
  # 1. BUILD APPLICATION
  # ==============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # ----------------------------------------------------------
      # Maven Build
      # ----------------------------------------------------------
      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package
      # ----------------------------------------------------------
      # Upload JAR
      # ----------------------------------------------------------
      - name: Upload Application Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: application
          path: target/*.jar


  # ==============================================================
  # 2. UNIT TESTS
  # ==============================================================
  unit-test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # ----------------------------------------------------------
      # Run Tests
      # ----------------------------------------------------------
      - name: Run Unit Tests
        run: |
          chmod +x mvnw
          ./mvnw test
      # ----------------------------------------------------------
      # Test Report
      # ----------------------------------------------------------
      - name: Publish Test Report
        uses: dorny/test-reporter@v2.2.0
        if: always()
        with:
          name: Unit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit


  # ==============================================================
  # 3. SONARQUBE CLOUD
  # ==============================================================
  code-quality:
    name: SonarQube Cloud Analysis
    needs: build
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # ----------------------------------------------------------
      # SonarQube Cloud
      #
      # Required GitHub variables:
      #
      # SONAR_PROJECT_KEY
      # SONAR_ORGANIZATION
      #
      # Required GitHub secret:
      #
      # SONAR_TOKEN
      # ----------------------------------------------------------
      - name: SonarQube Cloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw clean verify sonar:sonar \
            -Dsonar.projectKey="${{ vars.SONAR_PROJECT_KEY }}" \
            -Dsonar.organization="${{ vars.SONAR_ORGANIZATION }}" \
            -Dsonar.host.url="https://sonarcloud.io"
  # ==============================================================
  # 4. SECURITY SCAN
  # ==============================================================
  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # ==========================================================
      # TRIVY FILESYSTEM SCAN
      # ==========================================================
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # ==========================================================
      # TRUFFLEHOG SECRET SCAN
      # ==========================================================
      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown

      # ==========================================================
      # CODEQL INITIALIZATION
      # ==========================================================
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      # ==========================================================
      # CODEQL BUILD
      # ==========================================================
      - name: CodeQL Autobuild
        uses: github/codeql-action/autobuild@v4

      # ==========================================================
      # CODEQL ANALYSIS
      # ==========================================================
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4


  # ==============================================================
  # 5. DOCKER BUILD + PUSH
  # ==============================================================
  package:
    name: Build and Push Docker Image

    needs:
      - unit-test
      - code-quality
      - security-scan

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # ----------------------------------------------------------
      # Package Application
      # ----------------------------------------------------------
      - name: Package Application
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests
      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      # ----------------------------------------------------------
      # Docker Hub Login
      # ----------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ----------------------------------------------------------
      # Docker Metadata
      # ----------------------------------------------------------
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ env.APP_VERSION }}
      # ----------------------------------------------------------
      # Build + Push Docker Image
      # ----------------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.APP_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}

      # ----------------------------------------------------------
      # Trivy Docker Image Scan
      # ----------------------------------------------------------
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true


  # ==============================================================
  # 6. DEPLOY TO EC2
  # ==============================================================
  deploy:
    name: Deploy to EC2

    needs: package

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # SSH Deployment
      # ----------------------------------------------------------
      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USERNAME }}
          key: ${{ secrets.EC2_PASSWORD }}

          script: |
            # ====================================================
            # Variables
            # ====================================================
            set -e
            IMAGE="${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}"
            CONTAINER="${{ env.CONTAINER_NAME }}"
            echo "=========================================="
            echo "Starting deployment"
            echo "=========================================="
            echo "Application : ${{ env.APP_NAME }}"
            echo "Version     : ${{ env.APP_VERSION }}"
            echo "Image Tag   : ${{ env.IMAGE_TAG }}"
            echo "Container   : $CONTAINER"
            echo "=========================================="
            # ====================================================
            # Pull new image
            # ====================================================
            echo "Pulling Docker image..."
            docker pull "$IMAGE"
            echo "Docker image pulled successfully."
            # ====================================================
            # Stop existing container
            # ====================================================
            echo "Stopping existing container..."
            docker stop "$CONTAINER" || true
            # ====================================================
            # Remove existing container
            # ====================================================
            echo "Removing existing container..."
            docker rm "$CONTAINER" || true
            # ====================================================
            # Start new container
            # ====================================================
            echo "Starting new container..."
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE"
            echo "Container started."
            # ====================================================
            # Wait for Spring Boot
            # ====================================================
            echo "Waiting for application to start..."
            sleep 15
            # ====================================================
            # Check container
            # ====================================================
            echo "Checking container status..."
            if docker ps --format '{{.Names}}' | grep -q "^${CONTAINER}$"; then
              echo "Container is running successfully."
            else
              echo "ERROR: Container failed to start."
              echo "=========================================="
              echo "Container logs"
              echo "=========================================="
              docker logs "$CONTAINER" || true
              exit 1
            fi
            # ====================================================
            # Optional Spring Boot Health Check
            # ====================================================
            #
            # Enable this if you have:
            #
            # spring-boot-starter-actuator
            #
            # and:
            #
            # /actuator/health
            #
            # Uncomment the following section.
            # ====================================================
            # echo "Checking Spring Boot health..."
            #
            # if curl --fail --silent --show-error \
            #   http://localhost:8080/actuator/health; then
            #
            #   echo "Application health check passed."
            #
            # else
            #
            #   echo "ERROR: Application health check failed."
            #
            #   docker logs "$CONTAINER" || true
            #
            #   exit 1
            #
            # fi
            # ====================================================
            # Display running containers
            # ====================================================
            echo "=========================================="
            echo "Running containers"
            echo "=========================================="
            docker ps
            # ====================================================
            # Cleanup
            # ====================================================
            echo "Cleaning unused Docker images..."
            docker image prune -f
            # ====================================================
            # Deployment Complete
            # ====================================================
            echo "=========================================="
            echo "Deployment successful!"
            echo "=========================================="