name: Deploy Todo Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Default permissions: minimum required.
permissions:
  contents: read

env:
  APP_NAME: todo-backend
  IMAGE_TAG: ${{ github.sha }}
  CONTAINER_NAME: todo-backend-app
  APP_VERSION: ${{ github.run_number }}

jobs:

  # ============================================================
  # 1. BUILD
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: application
          path: target/*.jar


  # ============================================================
  # 2. UNIT TESTS
  # ============================================================
  unit-test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Unit Tests
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Publish Test Report
        uses: dorny/test-reporter@v2.2.0
        if: always()
        with:
          name: Unit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit


  # ============================================================
  # 3. SONARQUBE
  # ============================================================
  code-quality:
    name: Code Quality
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compile Application
        run: |
          chmod +x mvnw
          ./mvnw compile

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          # Uncomment for self-hosted SonarQube Server:
          # SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


  # ============================================================
  # 4. SECURITY
  # ============================================================
  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # --------------------------------------------------------
      # Trivy filesystem scan
      # --------------------------------------------------------
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # --------------------------------------------------------
      # TruffleHog secret scan
      # --------------------------------------------------------
      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown

      # --------------------------------------------------------
      # CodeQL
      # --------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: CodeQL Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4


  # ============================================================
  # 5. DOCKER BUILD + PUSH
  # ============================================================
  package:
    name: Build and Push Docker Image

    needs:
      - unit-test
      - code-quality
      - security-scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Package Application
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      # --------------------------------------------------------
      # Docker Hub login
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # --------------------------------------------------------
      # Docker metadata
      # --------------------------------------------------------
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ env.APP_VERSION }}

      # --------------------------------------------------------
      # Build + Push
      # --------------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.APP_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}

      # --------------------------------------------------------
      # Scan pushed Docker image
      # --------------------------------------------------------
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true


  # ============================================================
  # 6. DEPLOY TO EC2
  # ============================================================
  deploy:
    name: Deploy to EC2

    needs: package

    runs-on: ubuntu-latest

    steps:

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            IMAGE="${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}"
            CONTAINER="${{ env.CONTAINER_NAME }}"

            echo "========================================="
            echo "Starting deployment"
            echo "Image: $IMAGE"
            echo "Container: $CONTAINER"
            echo "========================================="

            echo "Pulling Docker image..."

            docker pull "$IMAGE"

            echo "Stopping old container..."

            docker stop "$CONTAINER" || true

            echo "Removing old container..."

            docker rm "$CONTAINER" || true

            echo "Starting new container..."

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE"

            echo "Waiting for container to start..."

            sleep 10

            echo "Checking container status..."

            if docker ps --format '{{.Names}}' | grep -q "^${CONTAINER}$"; then
              echo "Container is running."
            else
              echo "Container failed to start."
              echo ""
              echo "Container logs:"
              docker logs "$CONTAINER" || true
              exit 1
            fi

            echo "Checking application port..."

            if curl --fail --silent --show-error \
              http://localhost:8080/actuator/health; then

              echo ""
              echo "Application health check passed."

            else

              echo "Health endpoint unavailable or unhealthy."

              echo ""
              echo "Container logs:"
              docker logs "$CONTAINER" || true

              exit 1
            fi

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "========================================="
            echo "Deployment successful!"
            echo "========================================="
